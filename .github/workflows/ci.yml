name: Test og byg

# Staging er sat på pause (16/11): der pushes direkte til main = live, og denne kører hele testpakken bagefter som kontrol.
# Vitest i 6 dele (de tunge tests med den originale database er 2–5× langsommere på en GitHub-maskine end lokalt; deres faste tidsgrænser
# ganges med CI_TIMEOUT_FACTOR i vite.config.ts – ciTimeouts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --dir tests --testTimeout=900000 --shard=${{ matrix.shard }}/6

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [original, default]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e (${{ matrix.engine }})
        run: |
          if [ "${{ matrix.engine }}" = "original" ]; then E2E_ENGINE=original node scripts/e2e.mjs klassisk; else npm run e2e; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.engine }}
          path: e2e-shots
