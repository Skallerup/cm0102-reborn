name: IndexNow efter udgivelse

# Efter hvert push til main venter jobbet, til cm0102reborn.com serverer den nye commit (public/build.json skrives af
# scripts/build-seo.ts med VERCEL_GIT_COMMIT_SHA), og sender så de sider, hvis <lastmod> i sitemaps er ændret de seneste
# par dage, til IndexNow (Bing, Yandex, Naver m.fl. – Google bruger det ikke, den læser sitemap.xml selv).
# (Vercel opretter ikke GitHub-deployments for repoet, så deployment_status kan ikke bruges.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vent på at udgivelsen er live
        run: |
          for i in $(seq 1 60); do
            live=$(curl -s --max-time 10 https://cm0102reborn.com/build.json | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            echo "forsøg $i: live=$live"
            if [ "$live" = "${{ github.sha }}" ]; then exit 0; fi
            sleep 20
          done
          echo "udgivelsen blev ikke live inden for 20 min – springer over"; exit 1
      - run: npx --yes tsx scripts/indexnow.ts --remote --days 3
